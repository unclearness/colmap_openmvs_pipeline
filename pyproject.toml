[project]
name = "colmap-openmvs-pipeline"
version = "0.2.0"
description = "Multi-backend COLMAP, OpenMVS, RealityScan, and Metashape reconstruction pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
recon-pipeline = "recon_pipeline.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recon_pipeline"]
